[program:bioinfo_nexus]
directory=/path/to/BioInfo_Nexus_test  ; 请替换为实际的项目路径
command=/path/to/venv/bin/gunicorn -c gunicorn_config.py wsgi:application  ; 请替换为实际的虚拟环境路径
autostart=true
autorestart=true
startretries=5
numprocs=1
startsecs=0
process_name=%(program_name)s_%(process_num)02d
stderr_logfile=/path/to/BioInfo_Nexus_test/logs/supervisor_err.log  ; 请替换为实际的项目路径
stdout_logfile=/path/to/BioInfo_Nexus_test/logs/supervisor_out.log  ; 请替换为实际的项目路径
user=your_username  ; 请替换为实际的用户名
environment=
    PYTHONPATH="/path/to/BioInfo_Nexus_test",  ; 请替换为实际的项目路径
    PATH="/path/to/venv/bin:%(ENV_PATH)s"  ; 请替换为实际的虚拟环境路径 