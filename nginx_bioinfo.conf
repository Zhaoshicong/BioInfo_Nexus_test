server {
    listen 80;
    server_name _;  # 替换为您的域名
    
    # 日志设置
    access_log /var/log/nginx/bioinfo_nexus_access.log;
    error_log /var/log/nginx/bioinfo_nexus_error.log;
    
    # HTTPS重定向（可选）
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
    
    # 静态文件设置
    location /static/ {
        alias /path/to/BioInfo_Nexus_test/front_html/;  # 替换为您的静态文件路径
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # 上传文件设置
    location /uploads/ {
        alias /path/to/BioInfo_Nexus_test/uploads/;  # 替换为您的上传文件路径
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
    }
    
    # 所有其他请求代理到Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}