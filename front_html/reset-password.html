<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioInfo Nexus - 重置密码</title>
    <link rel="icon" href="img_data/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="img_data/favicon.ico" type="image/x-icon">
    <link href="css/icon-font.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset-password.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BioInfo Nexus</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="#" class="contact-link">联系我们
                    <span class="email-tooltip">bioinfo.nexus@example.com</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div id="particles-js"></div>
        <div class="content-wrapper">
            <div class="reset-password-container">
                <h2>重置密码</h2>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail"><b>邮箱</b></label>
                        <input type="email" id="resetEmail" name="email" placeholder="请输入注册邮箱" required>
                    </div>
                    <div class="form-group">
                        <label for="verificationCode"><b>验证码</b></label>
                        <div class="verification-container">
                            <input type="text" id="verificationCode" name="verificationCode" placeholder="请输入验证码" required>
                            <button type="button" class="verification-btn" id="sendVerificationCode">发送验证码</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword"><b>新密码</b></label>
                        <div class="password-container">
                            <input type="password" id="newPassword" name="password" placeholder="请输入新密码(至少8位,由字母数字组成)" required>
                            <button type="button" class="password-toggle" data-target="newPassword">
                                <i class="fas fa-eye-slash eye-icon"></i>
                            </button>
                            
                            <!-- 密码强度浮窗 -->
                            <div id="password-strength-popup" class="password-strength-popup">
                                <div class="strength-arrow"></div>
                                <div class="strength-item" id="length-check">
                                    <i class="fas fa-times-circle"></i> 至少8个字符
                                </div>
                                <div class="strength-item" id="letter-check">
                                    <i class="fas fa-times-circle"></i> 包含字母,数字
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword"><b>确认密码</b></label>
                        <div class="password-container">
                            <input type="password" id="confirmNewPassword" name="confirmPassword" placeholder="请再次输入新密码(至少8位,由字母数字组成)" required>
                            <button type="button" class="password-toggle" data-target="confirmNewPassword">
                                <i class="fas fa-eye-slash eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="reset-btn">重置密码</button>
                </form>
                <div id="resetMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="js/particles-config.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
