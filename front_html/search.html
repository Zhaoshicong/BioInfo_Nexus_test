<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序列分析 - BioInfo Nexus</title>
    <link rel="icon" href="img_data/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="img_data/favicon.ico" type="image/x-icon">
    <link href="css/icon-font.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.staticfile.org/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">BioInfo Nexus</a>
            <div class="nav-links">
                <a href="#" class="contact-link">联系我们
                    <span class="email-tooltip">bioinfo.nexus@example.com</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div id="particles-js"></div>
        <div class="hero-container">
            <div class="content-container">
                <h1 class="title">序列分析</h1>

                <div class="input-section">
                    <div class="input-group">
                        <textarea class="sequence-input" placeholder="请输入氨基酸序列..."></textarea>
                        <div class="char-counter">0 个氨基酸 <span style="margin-left: 10px; font-size: 12px; color: #666;">* 序列将自动转换为大写字母</span></div>
                    </div>

                    <div class="analysis-tools">
                        <div class="tool-cards">
                            <div class="tool-card" data-tool="protparam">
                                <div class="tool-icon">
                                    <i class="fas fa-balance-scale"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>分子量计算</h4>
                                    <p>使用BioPython计算分子量和氨基酸组成</p>
                                </div>
                            </div>

                            <div class="tool-card" data-tool="sequence_annotation">
                                <div class="tool-icon">
                                    <i class="fas fa-pencil-alt"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>序列注释分析</h4>
                                    <p>使用BioPython识别功能域和结构特性</p>
                                </div>
                            </div>

                            <div class="tool-card" data-tool="translate">
                                <div class="tool-icon">
                                    <i class="fas fa-dna"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>序列翻译</h4>
                                    <p>使用BioPython将D/RNA译为蛋白质序列</p>
                                </div>
                            </div>
                            
                            <div class="tool-card" data-tool="signalp">
                                <div class="tool-icon">
                                    <i class="fas fa-signal"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>信号肽预测</h4>
                                    <p>使用SignalP预测信号肽位点</p>
                                </div>
                            </div>

                            <div class="tool-card" data-tool="vaxijen">
                                <div class="tool-icon">
                                    <i class="fas fa-shield-alt"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>抗原性预测(细菌)</h4>
                                    <p>使用VaxiJen预测蛋白质抗原性</p>
                                </div>
                            </div>
                            
                            <div class="tool-card" data-tool="toxinpred">
                                <div class="tool-icon">
                                    <i class="fas fa-skull-crossbones"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>毒性预测(细菌)</h4>
                                    <p>使用ToxinPred预测肽的毒性(5-50个序列)</p>
                                </div>
                            </div>
                            
                            <div class="tool-card" data-tool="physchemparam">
                                <div class="tool-icon">
                                    <i class="fas fa-vial"></i>
                                </div>
                                <div class="tool-info">
                                    <h4>物理化学参数</h4>
                                    <p>使用ProtParam分析蛋白质的理化参数</p>
                                </div>
                            </div>
                        </div>

                        <button class="analyze-btn">
                            <i class="fas fa-play"></i>
                            开始分析
                        </button>
                    </div>
                </div>
                
                <!-- 管理工具区域已移除 -->
            </div>
        </div>
    </div>

    <script src="js/particles-config.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
