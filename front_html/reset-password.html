<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioInfo Nexus - 重置密码</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@600&family=Noto+Sans:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BioInfo Nexus</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="#" class="contact-link">联系我们
                    <span class="email-tooltip">bioinfo.nexus@example.com</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div id="particles-js"></div>
        <div class="content-wrapper">
            <div class="reset-password-container">
                <h2>重置密码</h2>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword"><b>新密码</b></label>
                        <div class="password-container">
                            <input type="password" id="newPassword" name="password" placeholder="请输入新密码" required>
                            <button type="button" class="password-toggle" data-target="newPassword">
                                <i data-lucide="eye" class="eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword"><b>确认密码</b></label>
                        <div class="password-container">
                            <input type="password" id="confirmNewPassword" name="confirmPassword" placeholder="请再次输入新密码" required>
                            <button type="button" class="password-toggle" data-target="confirmNewPassword">
                                <i data-lucide="eye" class="eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <input type="hidden" id="resetToken" name="token">
                    <button type="submit" class="reset-btn">重置密码</button>
                </form>
                <div id="resetMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="js/particles-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
            
            // 获取URL中的token参数
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showMessage('无效的重置链接！', 'error');
                return;
            }
            
            // 设置token到隐藏字段
            document.getElementById('resetToken').value = token;
            
            // 验证token是否有效
            fetch(`/api/auth/verify-reset-token/${token}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.valid) {
                        showMessage('重置链接无效或已过期！请重新申请。', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('验证重置链接时出错，请稍后再试。', 'error');
                });
            
            // 设置密码可见性切换
            const toggleButtons = document.querySelectorAll('.password-toggle');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    const eyeIcon = this.querySelector('.eye-icon');
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        eyeIcon.setAttribute('name', 'eye-off');
                    } else {
                        passwordInput.type = 'password';
                        eyeIcon.setAttribute('name', 'eye');
                    }
                    
                    lucide.createIcons();
                });
            });
            
            // 处理表单提交
            const resetForm = document.getElementById('resetPasswordForm');
            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmNewPassword').value;
                
                // 验证密码
                if (password !== confirmPassword) {
                    showMessage('两次输入的密码不一致！', 'error');
                    return;
                }
                
                // 显示加载状态
                const submitBtn = resetForm.querySelector('.reset-btn');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = '重置中...';
                submitBtn.disabled = true;
                
                // 发送重置密码请求
                fetch(`/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                })
                .then(response => {
                    // 保存响应状态
                    const isSuccess = response.ok;
                    return response.json().then(data => {
                        return { data, isSuccess };
                    });
                })
                .then(({ data, isSuccess }) => {
                    // 恢复按钮状态
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    if (isSuccess) {
                        showMessage(data.message || '密码重置成功！您现在可以使用新密码登录。', 'success');
                        
                        // 清空表单
                        resetForm.reset();
                        
                        // 3秒后重定向到登录页面
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 3000);
                    } else {
                        showMessage(data.message || '重置密码失败，请稍后再试。', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    showMessage('重置密码时出错，请稍后再试。', 'error');
                });
            });
            
            // 显示消息
            function showMessage(message, type) {
                const messageElement = document.getElementById('resetMessage');
                messageElement.textContent = message;
                messageElement.className = `message ${type}`;
            }
        });
    </script>
</body>
</html>
