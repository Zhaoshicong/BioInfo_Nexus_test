<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - BioInfo Nexus</title>
    <link rel="icon" href="img_data/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="img_data/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .login-header p {
            color: #7f8c8d;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #3498db;
            outline: none;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #3498db;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 15px;
        }
        
        .alert-danger {
            background-color: #fff1f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
        }
        
        .loading {
            display: none;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>BioInfo Nexus</h1>
            <p>管理员登录</p>
        </div>
        
        <div id="alert-container"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn">登录</button>
        </form>
        
        <a href="index.html" class="back-link">返回首页</a>
    </div>
    
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>
    
    <script src="js/utils/cookie-manager.js"></script>
    <script>
        // Helper function to decode JWT payload (basic, no signature verification)
        function decodeJwtPayload(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error("Error decoding JWT payload:", e);
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                login();
            });
        });
        
        function login() {
            const identifier = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!identifier || !password) {
                showAlert('请填写邮箱/用户名和密码', 'danger');
                return;
            }
            
            showLoading();
            
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: identifier,
                    password: password
                })
            })
            .then(response => {
                return response.json().then(data => {
                    if (!response.ok) {
                        throw new Error(data.message || `登录失败 (状态码: ${response.status})`);
                    }
                    return data;
                });
            })
            .then(data => {
                if (data.token) {
                    // --- 新增：打印完整登录响应数据 ---
                    console.log("完整登录响应数据:", data);
                    
                    // 检查用户是否是管理员 - 根据返回的role字段判断
                    if (data.role === 'admin') {
                        console.log("管理员登录成功，准备跳转...");
                        
                        // 使用cookies保存令牌和用户信息
                        cookieUtils.setCookie('auth_token', data.token, 7); // 7天过期
                        cookieUtils.setCookie('username', data.username, 7);
                        cookieUtils.setCookie('isAdmin', 'true', 7);
                        cookieUtils.setCookie('loginTime', new Date().toISOString(), 7);
                        
                        // 跳转到管理面板
                        console.log("跳转到管理面板...");
                        window.location.href = '/admin.html';
                    } else {
                        hideLoading();
                        showAlert('您没有管理员权限', 'danger');
                    }
                } else {
                    hideLoading();
                    showAlert('登录失败：未收到有效令牌', 'danger');
                }
            })
            .catch(error => {
                showAlert(error.message, 'danger');
                hideLoading();
            });
        }
        
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
